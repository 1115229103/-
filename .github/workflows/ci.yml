name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Python FastAPI Tests ─────────────────────────────────────
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fastapi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: fastapi/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run FastAPI unit tests
        run: python tests/test_fastapi.py --verbose
        env:
          MASTER_KEK: ci-test-master-kek-32bytes!!
          INTERNAL_API_TOKEN: ci-test-internal-token

  # ─── Frontend Build Check ─────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app:
          - { name: user-app, dir: laravel/user-app, out-dir: ../public/user-app }
          - { name: admin-app, dir: laravel/admin-app, out-dir: ../public/admin }
    defaults:
      run:
        working-directory: ${{ matrix.app.dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app.dir }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build ${{ matrix.app.name }}
        run: npm run build
      - name: Verify build output
        run: |
          test -f ${{ matrix.app.out-dir }}/index.html || (echo "Missing index.html" && exit 1)
          echo "Build output size:"
          du -sh ${{ matrix.app.out-dir }}/

  # ─── PHP Syntax & Composer Validate ───────────────────────────
  php-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: laravel
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, pdo_mysql, bcmath
      - name: Validate composer.json
        run: composer validate --strict
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: PHP Lint (app/)
        run: find app/ -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: PHP Lint (config/ + routes/ + database/)
        run: |
          find config/ -name '*.php' -print0 | xargs -0 -n1 php -l
          find routes/ -name '*.php' -print0 | xargs -0 -n1 php -l
          find database/migrations/ -name '*.php' -print0 | xargs -0 -n1 php -l
          find database/seeders/ -name '*.php' -print0 | xargs -0 -n1 php -l

  # ─── Integration Tests (Full Stack) ───────────────────────────
  integration-tests:
    runs-on: ubuntu-latest
    needs: [python-tests, frontend-build, php-validate]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: aistory
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: aistory
      DB_USERNAME: root
      DB_PASSWORD: root
      APP_ENV: testing
      APP_KEY: base64:EPHQBWgNHqGqsdmeFGUu2QN6GQBPxLoh02b5wibSj38=
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, mbstring, pdo_mysql, bcmath

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PHP dependencies
        run: |
          cd laravel
          composer install --prefer-dist --no-progress --no-interaction

      - name: Install Python dependencies
        run: |
          cd fastapi
          pip install -r requirements.txt

      - name: Setup Laravel
        run: |
          cd laravel
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force
          php artisan db:seed --force
          php artisan config:cache
          php artisan route:cache

      - name: Start FastAPI
        run: |
          cd fastapi
          cp .env.example .env 2>/dev/null || true
          export MASTER_KEK=ci-master-kek-for-integration-32b!
          export INTERNAL_API_TOKEN=ci-internal-token
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 3
          curl -s http://127.0.0.1:8000/health

      - name: Start Laravel dev server
        run: |
          cd laravel
          php artisan serve --host=127.0.0.1 --port=8080 &
          sleep 3
          curl -s http://127.0.0.1:8080/api/v1/health

      - name: Run PHP tests
        run: |
          cd laravel
          php tests/api_smoke.php
          php tests/admin_api_smoke.php
          php tests/e2e.php
          php tests/user_journey.php
          php tests/security_fuzz.php
          php tests/ux_quality_audit.php

  # ─── Result Summary ───────────────────────────────────────────
  ci-summary:
    needs: [python-tests, frontend-build, php-validate, integration-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          echo "python-tests: ${{ needs.python-tests.result }}"
          echo "frontend-build: ${{ needs.frontend-build.result }}"
          echo "php-validate: ${{ needs.php-validate.result }}"
          echo "integration-tests: ${{ needs.integration-tests.result }}"
          if [[ "${{ needs.python-tests.result }}" != "success" ]] ||
             [[ "${{ needs.frontend-build.result }}" != "success" ]] ||
             [[ "${{ needs.php-validate.result }}" != "success" ]] ||
             [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
            echo "CI FAILED"
            exit 1
          fi
          echo "CI PASSED — all jobs green"

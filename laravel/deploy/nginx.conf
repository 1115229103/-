# AIStory — Nginx Production Config
# Place at /etc/nginx/sites-available/aistory

server {
    listen 80;
    listen [::]:80;
    server_name aistory.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aistory.example.com;

    root /var/www/aistory/laravel/public;
    index index.php;

    ssl_certificate     /etc/ssl/certs/aistory.pem;
    ssl_certificate_key /etc/ssl/private/aistory.key;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static frontend apps (served by Laravel as static files)
    location /user-app/ {
        alias /var/www/aistory/laravel/public/user-app/;
        try_files $uri $uri/ /user-app/index.html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /admin/ {
        alias /var/www/aistory/laravel/public/admin/;
        try_files $uri $uri/ /admin/index.html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API — route to Laravel
    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    # Laravel PHP handling
    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* (?:\.(?:env|log|sql|md|yml|yaml)|composer\.(?:json|lock)|package\.json)$ {
        deny all;
    }

    # Static asset caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Upload size limit
    client_max_body_size 100M;
}

# AIStory — Nginx Production Config
# Place at /etc/nginx/sites-available/aistory

server {
    listen 80;
    listen [::]:80;
    server_name aistory.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aistory.example.com;

    root /var/www/aistory/laravel/public;
    index index.php;

    ssl_certificate     /etc/ssl/certs/aistory.pem;
    ssl_certificate_key /etc/ssl/private/aistory.key;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.bunny.net; font-src 'self' https://fonts.bunny.net; img-src 'self' data: blob: https:; connect-src 'self' https:; media-src 'self' blob:;" always;

    # FastAPI internal proxy (AI orchestration)
    location /internal/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_connect_timeout 30s;
    }

    # API — route to Laravel
    location /api/ {
        try_files $uri /index.php?$query_string;
    }

    # Admin SPA — static files with cache
    location /admin {
        alias /var/www/aistory/laravel/public/admin;
        try_files $uri $uri/ /admin/index.html;
    }
    location /admin/assets/ {
        alias /var/www/aistory/laravel/public/admin/assets/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # User-app SPA — catch all other routes
    location / {
        try_files $uri /user-app/index.html;
    }

    # User-app static assets (long-term cache)
    location /user-app/assets/ {
        root /var/www/aistory/laravel/public;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    # Deny access to sensitive files
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* (?:\.(?:env|log|sql|md|yml|yaml)|composer\.(?:json|lock)|package\.json)$ {
        deny all;
    }

    # Static asset caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Upload size limit
    client_max_body_size 100M;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
}

; AIStory — Supervisor Queue Worker Config
; Place at /etc/supervisor/conf.d/aistory-worker.conf

[program:aistory-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/aistory/laravel/artisan queue:work --sleep=3 --tries=3 --timeout=600 --max-time=3600
directory=/var/www/aistory/laravel
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/aistory/laravel/storage/logs/worker.log
stopwaitsecs=3600

; For high-throughput periods, scale to 4 workers:
; numprocs=4
